name: Assemble app parts
on:
  workflow_dispatch:
  push:
    paths:
      - '_build/**'
permissions:
  contents: write
concurrency:
  group: assemble-app
  cancel-in-progress: true
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble app.part*.js from base64 chunks
        run: |
          set -euo pipefail
          mkdir -p _build
          for i in 0 1 2 3; do
            if ls _build/app.part${i}.b64.* >/dev/null 2>&1; then
              cat $(ls _build/app.part${i}.b64.* | sort -V) | base64 -d > app.part${i}.js
              echo "Wrote app.part${i}.js ($(wc -c < app.part${i}.js) bytes)"
            fi
          done
          if [[ -f app.part0.js && -f app.part1.js && -f app.part2.js && -f app.part3.js && -f app.part4.js ]]; then
            cat app.part0.js app.part1.js app.part2.js app.part3.js app.part4.js > app.full.js
            echo "Wrote app.full.js ($(wc -c < app.full.js) bytes)"
          fi
      - name: Commit assembled parts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.part0.js app.part1.js app.part2.js app.part3.js app.full.js || true
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Assemble app.part*.js from base64 build chunks"
            git push
          fi
