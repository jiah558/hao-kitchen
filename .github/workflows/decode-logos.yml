name: Decode logos
on:
  workflow_dispatch:
  push:
    paths:
      - '_build/logo*.b64*'
      - '_build/favicon.png.b64'
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode logo assets
        run: |
          set -euo pipefail
          mkdir -p _build
          decode() {
            # Accept raw base64 or pipe-substituted (/ stored as |)
            tr '|' '/' < "$1" | tr -d '\n\r ' | base64 -d > "$2"
          }
          if ls _build/logo.png.b64.* >/dev/null 2>&1; then
            cat _build/logo.png.b64.* > /tmp/logo.png.b64.all
            decode /tmp/logo.png.b64.all logo.png
          elif [ -f _build/logo.png.b64 ]; then
            decode _build/logo.png.b64 logo.png
          fi
          if ls _build/logo-128.png.b64.* >/dev/null 2>&1; then
            cat _build/logo-128.png.b64.* > /tmp/logo-128.png.b64.all
            decode /tmp/logo-128.png.b64.all logo-128.png
          elif [ -f _build/logo-128.png.b64 ]; then
            decode _build/logo-128.png.b64 logo-128.png
          fi
          if [ -f _build/favicon.png.b64 ]; then
            decode _build/favicon.png.b64 favicon.png
          fi
          file logo.png logo-128.png favicon.png || true
          ls -la logo.png logo-128.png favicon.png
      - name: Commit decoded logos
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logo.png logo-128.png favicon.png
          if git diff --cached --quiet; then
            echo "No logo changes"
            exit 0
          fi
          git commit -m "Decode selfie logo and favicon from base64"
          git push
