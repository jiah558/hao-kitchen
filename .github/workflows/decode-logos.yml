name: Decode logos
on:
  workflow_dispatch:
  push:
    paths:
      - '_build/logo*.b64*'
      - '_build/logo*.hex*'
      - '_build/favicon.png.b64'
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode logo assets
        run: |
          set -euo pipefail
          mkdir -p _build
          python3 <<'PY'
          from pathlib import Path
          import base64

          def decode_b64_text(text: str) -> bytes:
              text = text.replace("|", chr(47)).replace("\n", "").replace("\r", "").replace(" ", "")
              return base64.b64decode(text)

          build = Path("_build")

          hex_parts = sorted(build.glob("logo.png.hex.*"))
          b64_parts = sorted(build.glob("logo.png.b64.*"))
          if hex_parts:
              hx = "".join(p.read_text() for p in hex_parts)
              Path("logo.png").write_bytes(decode_b64_text(bytes.fromhex(hx).decode()))
          elif b64_parts:
              Path("logo.png").write_bytes(decode_b64_text("".join(p.read_text() for p in b64_parts)))
          elif (build / "logo.png.b64").exists():
              Path("logo.png").write_bytes(decode_b64_text((build / "logo.png.b64").read_text()))

          parts128 = sorted(build.glob("logo-128.png.b64.*"))
          if parts128:
              Path("logo-128.png").write_bytes(decode_b64_text("".join(p.read_text() for p in parts128)))
          elif (build / "logo-128.png.b64").exists():
              Path("logo-128.png").write_bytes(decode_b64_text((build / "logo-128.png.b64").read_text()))

          fav = build / "favicon.png.b64"
          if fav.exists():
              Path("favicon.png").write_bytes(decode_b64_text(fav.read_text()))

          for name in ("logo.png", "logo-128.png", "favicon.png"):
              p = Path(name)
              if p.exists():
                  print(name, p.stat().st_size, p.read_bytes()[:8])
          PY
      - name: Commit decoded logos
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logo.png logo-128.png favicon.png
          if git diff --cached --quiet; then
            echo "No logo changes"
            exit 0
          fi
          git commit -m "Decode selfie logo and favicon from base64"
          git push
