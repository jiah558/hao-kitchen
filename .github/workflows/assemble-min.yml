name: Assemble min app
on:
  workflow_dispatch:
  push:
    paths:
      - "_build/app.min.*.b64.*"
permissions:
  contents: write
concurrency:
  group: assemble-min-app
  cancel-in-progress: true
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble app.min.*.js and app.js loader
        run: |
          set -euo pipefail
          for i in 0 1 2; do
            if ls _build/app.min.${i}.js.b64.* >/dev/null 2>&1; then
              cat $(ls _build/app.min.${i}.js.b64.* | sort -V) | base64 -d > "app.min.${i}.js"
              echo "Wrote app.min.${i}.js ($(wc -c < app.min.${i}.js) bytes)"
            fi
          done
          printf '%s\n' \
            '(async function(){' \
            '  try{' \
            '    const parts=["app.min.0.js", "app.min.1.js", "app.min.2.js"];' \
            '    const texts=await Promise.all(parts.map(p=>fetch(p+"?v=20260924f").then(r=>{if(!r.ok)throw new Error(p+":"+r.status);return r.text()})));' \
            '    (0,eval)(texts.join(""));' \
            '  }catch(e){console.error(e);const el=document.createElement("div");el.className="load-error-banner";el.textContent="应用脚本加载失败："+(e&&e.message?e.message:String(e));document.body.prepend(el);}' \
            '})();' > app.js
          echo "Wrote app.js ($(wc -c < app.js) bytes)"
          test -s app.min.0.js && test -s app.min.1.js && test -s app.min.2.js
          # verify concat matches expected size ~37k
          cat app.min.0.js app.min.1.js app.min.2.js > /tmp/app.min.joined.js
          echo "Joined $(wc -c < /tmp/app.min.joined.js) bytes"
      - name: Commit assembled min app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.min.0.js app.min.1.js app.min.2.js app.js
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Assemble app.min.*.js from base64 chunks; switch app.js loader"
            git push
          fi
